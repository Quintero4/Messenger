<!doctype html><html lang="es"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;font:13px Tahoma,Verdana,sans-serif;background:radial-gradient(circle at 30% 10%,#fff,#dbeeff 38%,#91bbe4);color:#123}.shell{width:min(1000px,96vw);height:min(720px,94vh);margin:3vh auto;border:1px solid #174b86;border-radius:14px;overflow:hidden;box-shadow:0 18px 55px #1c4e8066;background:#f7fbff}.titlebar{height:48px;padding:7px 12px;color:#fff;background:linear-gradient(#4aa2ed,#0a61b8 55%,#06498e);display:flex;align-items:center;gap:10px}.orb{width:30px;height:30px;border-radius:50%;background:linear-gradient(145deg,#b9ff91,#49a61e);border:2px solid #fff}.layout{height:calc(100% - 48px);display:grid;grid-template-columns:235px 1fr}.contacts{border-right:1px solid #6c9fd5;background:linear-gradient(90deg,#eef7ff,#d9ecff);overflow:auto}.profile{padding:14px 12px;border-bottom:1px solid #94b8dd}.avatar{width:48px;height:48px;border:3px solid #fff;outline:1px solid #85a9cd;border-radius:8px;background:linear-gradient(135deg,#94cfff,#2c6cb3);display:grid;place-items:center;color:#fff;font-size:25px;float:left;margin-right:10px}.status{color:#368509}.tiny{font-size:11px;color:#59728c}.contact-title{padding:12px 10px 6px;font-weight:bold;color:#174b86}.user{padding:9px 10px;display:flex;gap:8px;align-items:center;cursor:pointer;border-top:1px solid transparent;border-bottom:1px solid transparent}.user:hover,.user.active{background:#fff;border-color:#9fc2e5}.dot{width:11px;height:11px;border-radius:50%;background:#aaa;border:1px solid #fff;box-shadow:0 0 0 1px #777}.dot.on{background:#59ca25}.chat{display:grid;grid-template-rows:66px 1fr 95px;background:#fff}.buddybar{padding:10px 14px;background:linear-gradient(#fff,#e6f2fc);border-bottom:1px solid #8cb4dd}.buddybar b{font-size:16px;color:#174b86}.messages{overflow:auto;padding:15px;background:linear-gradient(#fff,#f2f8fe)}.empty{height:100%;display:grid;place-items:center;color:#6b8299;text-align:center}.msg{max-width:75%;margin:0 0 12px}.msg.me{margin-left:auto;text-align:right}.who{font-size:11px;color:#577795;margin-bottom:3px}.bubble{display:inline-block;text-align:left;padding:9px 12px;border:1px solid #8eb8de;border-radius:5px 13px 13px;background:linear-gradient(#fff,#e8f3fc)}.me .bubble{border-radius:13px 5px 13px 13px;background:linear-gradient(#f5ffe9,#d9f4bd);border-color:#9abf72}.composer{padding:9px;background:linear-gradient(#e8f3fc,#cddff1);border-top:1px solid #87acd0;display:grid;grid-template-columns:1fr 94px;gap:8px}.composer textarea{resize:none;border:1px solid #6e9bc8;border-radius:5px;padding:9px;font:13px Tahoma}.send{border:1px solid #0a4b8e;border-radius:7px;color:#fff;font-weight:bold;background:linear-gradient(#68b5f1,#0b69c4 60%,#07509a);cursor:pointer}.send:disabled{opacity:.5}@media(max-width:700px){.layout{grid-template-columns:165px 1fr}.shell{height:100vh;width:100vw;margin:0;border-radius:0}}</style></head><body><div class="shell"><div class="titlebar"><span class="orb"></span><strong>RetroTalk 2000</strong><span>• conversaciones privadas</span></div><div class="layout"><aside class="contacts"><div class="profile"><div class="avatar">☺</div><b id="myName">Conectando…</b><div class="status">● Disponible</div><div class="tiny">Selecciona un contacto</div><div style="clear:both"></div></div><div class="contact-title">Contactos</div><div id="users"></div></aside><main class="chat"><div class="buddybar"><b id="chatName">Ningún contacto seleccionado</b><div class="tiny" id="chatStatus">Elige una persona en la lista</div></div><div id="messages" class="messages"><div class="empty">Selecciona un contacto para iniciar una conversación privada.</div></div><div class="composer"><textarea id="text" disabled maxlength="1000" placeholder="Escribe un mensaje… Intro envía; Shift+Intro crea una línea"></textarea><button id="send" class="send" disabled>Enviar</button></div></main></div></div><script>
const state={me:null,selected:null,last:'',seen:new Set(),timer:null,demo:!(window.google&&google.script&&google.script.run)};const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const call=(fn,...a)=>new Promise((ok,bad)=>google.script.run.withSuccessHandler(ok).withFailureHandler(bad)[fn](...a));
function tone(freq,duration,vol=.05){try{const C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+duration/1000);o.stop(c.currentTime+duration/1000)}catch(e){}}
function sentSound(){tone(660,90);setTimeout(()=>tone(880,110),80)}function incomingSound(){tone(880,100);setTimeout(()=>tone(660,130),100)}
function renderUsers(users){$('#users').innerHTML=users.map(u=>`<div class="user ${state.selected?.email===u.email?'active':''}" data-email="${esc(u.email)}"><i class="dot ${u.online?'on':''}"></i><span>${esc(u.name)}</span></div>`).join('');document.querySelectorAll('.user').forEach(el=>el.onclick=()=>selectUser(users.find(u=>u.email===el.dataset.email)))}
function selectUser(u){state.selected=u;state.last='';state.seen.clear();$('#chatName').textContent=u.name;$('#chatStatus').textContent=u.online?'● Disponible':'○ Desconectado';$('#text').disabled=$('#send').disabled=false;$('#messages').innerHTML='';renderUsers(state.users);load(true);$('#text').focus()}
function render(m,notify=false){if(state.seen.has(m.id))return;state.seen.add(m.id);state.last=m.timestamp;const mine=m.senderEmail===state.me.email,d=document.createElement('div');d.className='msg '+(mine?'me':'');d.innerHTML=`<div class="who">${esc(m.senderName)} · ${new Date(m.timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div><div class="bubble">${esc(m.text).replace(/\n/g,'<br>')}</div>`;$('#messages').append(d);$('#messages').scrollTop=$('#messages').scrollHeight;if(notify&&!mine)incomingSound()}
async function load(initial=false){if(!state.selected)return;if(state.demo)return;try{const d=await call('getConversation',state.selected.email,initial?'':state.last);state.users=d.users;renderUsers(d.users);d.messages.forEach(m=>render(m,!initial))}catch(e){}clearTimeout(state.timer);state.timer=setTimeout(()=>load(false),3000)}
async function send(){const text=$('#text').value.trim();if(!text||!state.selected)return;$('#send').disabled=true;try{let m;if(state.demo)m={id:crypto.randomUUID(),timestamp:new Date().toISOString(),senderEmail:state.me.email,senderName:state.me.name,recipientEmail:state.selected.email,text};else m=await call('sendPrivateMessage',state.selected.email,text);render(m);$('#text').value='';sentSound()}catch(e){alert(e.message||e)}finally{$('#send').disabled=false;$('#text').focus()}}
$('#send').onclick=send;$('#text').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
async function boot(){if(state.demo){state.me={email:'fernando@empresa.es',name:'Fernando'};state.users=[{email:'laura@empresa.es',name:'Laura',online:true},{email:'equipo@empresa.es',name:'Equipo Formación',online:true},{email:'soporte@empresa.es',name:'Soporte',online:false}];$('#myName').textContent=state.me.name;renderUsers(state.users);return}try{const d=await call('bootstrap');state.me=d.me;state.users=d.users;$('#myName').textContent=d.me.name;renderUsers(d.users)}catch(e){alert(e.message||e)}}boot();
</script></body></html>

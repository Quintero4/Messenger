<!doctype html><html lang="es"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--blue:#1266c9;--deep:#063b85;--pale:#eaf4ff;--line:#8bb7e8;--green:#72c83e;--gray:#d8e5f2}*{box-sizing:border-box}body{margin:0;font:13px Tahoma,Verdana,sans-serif;background:radial-gradient(circle at 30% 10%,#fff 0,#dbeeff 35%,#94bfe8 100%);color:#123}.shell{width:min(1000px,96vw);height:min(720px,94vh);margin:3vh auto;border:1px solid #174b86;border-radius:14px;overflow:hidden;box-shadow:0 18px 55px #1c4e8066;background:#f7fbff}.titlebar{height:48px;padding:7px 12px;color:white;background:linear-gradient(#4aa2ed,#0a61b8 55%,#06498e);display:flex;align-items:center;gap:10px}.orb{width:30px;height:30px;border-radius:50%;background:linear-gradient(145deg,#b9ff91,#49a61e);border:2px solid white;box-shadow:0 0 0 1px #1b6410}.titlebar strong{font-size:17px;text-shadow:0 1px #034}.winbtns{margin-left:auto;display:flex;gap:4px}.winbtns i{width:22px;height:18px;border:1px solid #dcefff;border-radius:3px;background:linear-gradient(#fff8,#0c5aaa);display:block}.layout{height:calc(100% - 48px);display:grid;grid-template-columns:220px 1fr}.contacts{border-right:1px solid #6c9fd5;background:linear-gradient(90deg,#eef7ff,#d9ecff);display:flex;flex-direction:column}.profile{padding:14px 12px;border-bottom:1px solid #94b8dd;background:#fff8}.avatar{width:52px;height:52px;border:3px solid white;outline:1px solid #85a9cd;border-radius:8px;background:linear-gradient(135deg,#94cfff,#2c6cb3);display:grid;place-items:center;color:#fff;font-size:28px;float:left;margin-right:10px}.status{color:#368509}.contact-title{padding:9px;font-weight:bold;color:#174b86}.user{padding:7px 10px;display:flex;gap:8px;align-items:center}.dot{width:11px;height:11px;border-radius:50%;background:#aaa;border:1px solid white;box-shadow:0 0 0 1px #777}.dot.on{background:#59ca25}.chat{display:grid;grid-template-rows:66px 1fr 95px;background:white}.buddybar{padding:10px 14px;background:linear-gradient(#fff,#e6f2fc);border-bottom:1px solid #8cb4dd}.buddybar b{font-size:16px;color:#174b86}.tiny{font-size:11px;color:#59728c}.messages{overflow:auto;padding:15px;background:linear-gradient(#fff,#f2f8fe)}.msg{max-width:75%;margin:0 0 12px}.msg.me{margin-left:auto;text-align:right}.who{font-size:11px;color:#577795;margin-bottom:3px}.bubble{display:inline-block;text-align:left;padding:9px 12px;border:1px solid #8eb8de;border-radius:5px 13px 13px 13px;background:linear-gradient(#fff,#e8f3fc);box-shadow:0 2px 4px #2b5f8a22}.me .bubble{border-radius:13px 5px 13px 13px;background:linear-gradient(#f5ffe9,#d9f4bd);border-color:#9abf72}.composer{padding:9px;background:linear-gradient(#e8f3fc,#cddff1);border-top:1px solid #87acd0;display:grid;grid-template-columns:1fr 94px;gap:8px}.composer textarea{resize:none;border:1px solid #6e9bc8;border-radius:5px;padding:9px;font:13px Tahoma;background:white;box-shadow:inset 0 1px 3px #7893aa55}.send{border:1px solid #0a4b8e;border-radius:7px;color:white;font-weight:bold;background:linear-gradient(#68b5f1,#0b69c4 60%,#07509a);cursor:pointer}.send:hover{filter:brightness(1.08)}.toast{position:fixed;right:25px;bottom:25px;padding:14px 18px;border:1px solid #245c94;border-radius:9px;background:linear-gradient(#fff,#ddecfa);box-shadow:0 8px 24px #174b8666;display:none}.login{position:fixed;inset:0;background:#0a4b8e88;display:grid;place-items:center;z-index:4}.card{background:#f5faff;border:1px solid #174b86;border-radius:12px;padding:22px;width:310px;box-shadow:0 18px 60px #1238}.card input{width:100%;padding:9px;border:1px solid #7da8d3;margin:10px 0}.card button{width:100%;padding:9px}.hidden{display:none}@media(max-width:700px){.layout{grid-template-columns:1fr}.contacts{display:none}.shell{height:100vh;width:100vw;margin:0;border-radius:0}.msg{max-width:88%}}
</style></head><body><div class="shell"><div class="titlebar"><span class="orb"></span><strong>RetroTalk 2000</strong><span>• Chat interno</span><div class="winbtns"><i></i><i></i><i></i></div></div><div class="layout"><aside class="contacts"><div class="profile"><div class="avatar">☺</div><b id="myName">Conectando…</b><div class="status">● Disponible</div><div class="tiny">Trabajando con nostalgia</div><div style="clear:both"></div></div><div class="contact-title">Contactos</div><div id="users"></div></aside><main class="chat"><div class="buddybar"><b>Sala general</b><div class="tiny">Los mensajes se guardan en Google Sheets • actualización automática</div><button id="notifyBtn" style="float:right;margin-top:-25px">Activar avisos</button></div><div id="messages" class="messages"></div><div class="composer"><textarea id="text" maxlength="1000" placeholder="Escribe un mensaje… (Enter para enviar)"></textarea><button class="send" id="send">Enviar</button></div></main></div></div><div class="toast" id="toast"></div>
<script>
const state={me:null,last:'',seen:new Set(),demo:!(window.google&&google.script&&google.script.run),timer:null};
const $=s=>document.querySelector(s); const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function call(fn,...args){return new Promise((ok,bad)=>google.script.run.withSuccessHandler(ok).withFailureHandler(bad)[fn](...args))}
function renderMsg(m,notify=false){if(state.seen.has(m.id))return;state.seen.add(m.id);state.last=m.timestamp;const me=state.me&&m.email===state.me.email;const el=document.createElement('div');el.className='msg '+(me?'me':'');el.innerHTML=`<div class="who">${esc(m.displayName)} · ${new Date(m.timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div><div class="bubble">${esc(m.text).replace(/\n/g,'<br>')}</div>`;$('#messages').append(el);$('#messages').scrollTop=$('#messages').scrollHeight;if(notify&&!me)announce(m)}
function renderUsers(users){$('#users').innerHTML=users.map(u=>`<div class="user"><i class="dot ${u.online?'on':''}"></i><span>${esc(u.name)}</span></div>`).join('')}
function announce(m){$('#toast').textContent=`${m.displayName}: ${m.text}`;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3500);document.title='● Nuevo mensaje - RetroTalk';setTimeout(()=>document.title='RetroTalk 2000',4000);try{new Audio('data:audio/wav;base64,UklGRjQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YRAAAAAAAP8A/wAAAP8A').play()}catch(e){}if(Notification.permission==='granted')new Notification('RetroTalk 2000',{body:`${m.displayName}: ${m.text}`})}
async function boot(){if(state.demo){state.me={email:'fernando@empresa.es',name:'Fernando'};$('#myName').textContent=state.me.name;renderUsers([{name:'Laura',online:true},{name:'Equipo Formación',online:true},{name:'Soporte',online:false}]);[{id:'1',timestamp:new Date(Date.now()-120000).toISOString(),email:'laura@empresa.es',displayName:'Laura',text:'¡Hola! Bienvenido al chat retro 👋'},{id:'2',timestamp:new Date(Date.now()-50000).toISOString(),email:state.me.email,displayName:state.me.name,text:'Funciona genial. Parece 2003 otra vez.'}].forEach(m=>renderMsg(m));return}try{const d=await call('getBootstrap');state.me=d.me;$('#myName').textContent=d.me.name;renderUsers(d.users);d.messages.forEach(m=>renderMsg(m));poll()}catch(e){alert(e.message||e)}}
async function poll(){try{const ms=await call('getMessages',state.last);ms.forEach(m=>renderMsg(m,true));renderUsers(await call('heartbeat'))}catch(e){}state.timer=setTimeout(poll,3000)}
async function send(){const t=$('#text').value.trim();if(!t)return;$('#send').disabled=true;try{if(state.demo){renderMsg({id:crypto.randomUUID(),timestamp:new Date().toISOString(),email:state.me.email,displayName:state.me.name,text:t})}else{renderMsg(await call('sendMessage',t))}$('#text').value=''}catch(e){alert(e.message||e)}finally{$('#send').disabled=false;$('#text').focus()}}
$('#send').onclick=send;$('#text').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('#notifyBtn').onclick=async()=>{if(!('Notification'in window))return alert('El navegador no admite notificaciones.');const p=await Notification.requestPermission();$('#notifyBtn').textContent=p==='granted'?'Avisos activados':'Avisos bloqueados'};boot();
</script></body></html>
